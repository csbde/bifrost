name: Build and Push Bifrost Docker Image

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 拉取 dev 分支代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: dev

      # 启用 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云镜像仓库
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # 获取 Git Commit SHA
      - name: Prepare image tags
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 构建并推送
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile.local
          push: true
          # 阿里云 ACR 兼容性
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.short_sha }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/com_zoogooo/bifrost:latest
            registry.cn-hangzhou.aliyuncs.com/com_zoogooo/bifrost:${{ steps.meta.outputs.short_sha }}
